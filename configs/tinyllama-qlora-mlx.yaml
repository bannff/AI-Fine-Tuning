# QLoRA on TinyLlama via MLX: 4-bit base, LoRA adapters on top.
#
# In MLX, quantisation is not a trainer flag. This config makes `finetune train`
# run two stages: `mlx_lm convert -q` to produce a quantised base under
# <output_dir>/quantized-base, then LoRA against that copy.
#
# `finetune plan configs/tinyllama-qlora-mlx.yaml` shows both stages before
# anything runs.

model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
method: qlora
backend: mlx

data_dir: ../data/tinyllama
output_dir: ../outputs/tinyllama-qlora-mlx

quantization:
  bits: 4
  group_size: 64

adapter:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  num_layers: -1

training:
  batch_size: 4
  iters: 600
  # Omitted learning_rate falls back to the method default (2e-4 for low-rank
  # methods, 2e-6 for full). `finetune plan` prints the resolved value.
  max_seq_length: 1024
  mask_prompt: true
  grad_checkpoint: true
  steps_per_report: 10
  steps_per_eval: 100
