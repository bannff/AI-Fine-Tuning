# LoRA on TinyLlama via PyTorch + TRL. Portable: CUDA, MPS or CPU.
#
#   finetune train configs/tinyllama-lora-torch.yaml
#
# Needs the torch extra:  uv sync --extra torch

model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
method: lora
backend: torch

data_dir: ../data/tinyllama
output_dir: ../outputs/tinyllama-lora-torch

adapter:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules: all-linear
  # Rank-stabilised scaling (alpha / sqrt(rank)) keeps the update magnitude
  # steady as rank grows. Worth turning on if you plan to raise rank.
  use_rslora: true

training:
  batch_size: 2
  gradient_accumulation_steps: 4   # effective batch 8
  epochs: 1
  learning_rate: 2.0e-4
  max_seq_length: 1024
  seed: 42
  mask_prompt: true
  grad_checkpoint: true
  steps_per_report: 10
  save_every: 200
