# Full-parameter SFT on TinyLlama via MLX. No adapter; every weight moves.
#
# Memory scales with the whole model, so this is the one config where
# grad_checkpoint genuinely matters. TinyLlama-1.1B fits comfortably on a 16 GB
# machine; a 3.8B model at full precision generally does not, and QLoRA is the
# right fallback there (configs/tinyllama-qlora-mlx.yaml).
#
# Note the learning rate: two orders of magnitude below the LoRA configs. Full
# fine-tuning at a LoRA rate diverges, and NaN validation loss is the usual
# first symptom.

model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
method: full
backend: mlx

data_dir: ../data/tinyllama
output_dir: ../outputs/tinyllama-full-sft-mlx

training:
  batch_size: 4
  iters: 600
  learning_rate: 2.0e-6
  max_seq_length: 2048
  seed: 42
  mask_prompt: true
  grad_checkpoint: true
  steps_per_report: 10
  steps_per_eval: 50
  save_every: 100
