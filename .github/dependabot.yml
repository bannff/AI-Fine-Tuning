version: 2
updates:
  # Reads pyproject.toml and uv.lock. Previously declared with no manifest in the
  # repository for it to parse.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "type:chore"
      - "agent:security-engineer"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
